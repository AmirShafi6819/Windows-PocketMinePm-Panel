name: Build Windows exe

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PMPANEL_VERSION: 2.8.2
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go (for the fake-player engine)
        uses: actions/setup-go@v5
        with:
          go-version-file: pmbot/go.mod
          cache-dependency-path: pmbot/go.sum

      - name: Build bot engine (pmbot.exe, GOOS=windows)
        run: |
          cd pmbot
          go build -trimpath -ldflags "-s -w" -o ../build/resources-native/native/pmbot.exe .
          dir ..\build\resources-native\native
        shell: cmd

      - name: Download official Windows PHP runtime (pmmp/PHP-Binaries)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\resources-native\native | Out-Null
          $url = "https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-8.4-latest/PHP-8.4-Windows-x64-PM5.zip"
          $out = "build\resources-native\native\php-windows.zip"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $url -OutFile $out -UserAgent "PMPanel-Windows-CI"
          if ((Get-Item $out).Length -lt 5MB) { throw "PHP download failed" }
          Write-Host "PHP zip: $((Get-Item $out).Length / 1MB) MB"

      - name: Build app image (jlink + jpackage)
        run: .\gradlew.bat packageApp --no-daemon --stacktrace

      - name: Verify app image
        shell: pwsh
        run: |
          $exe = "build\jpackage\PMPanel\PMPanel.exe"
          if (-not (Test-Path $exe)) { throw "PMPanel.exe was not produced" }
          Get-ChildItem build\jpackage\PMPanel | Select-Object Name
          Get-ChildItem build\jpackage\PMPanel\app | Select-Object Name

      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          foreach ($c in $candidates) {
            if (Test-Path $c) { Write-Host "ISCC=$c"; "path=$c" | Out-File -FilePath $env:GITHUB_OUTPUT -Append; exit 0 }
          }
          Write-Host "Inno Setup not found - installing"
          choco install innosetup -y --no-progress
          $c = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $c)) { $c = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $c)) { throw "ISCC.exe not found after install" }
          "path=$c" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer (Setup.exe)
        shell: pwsh
        env:
          PMPANEL_APPDIR: ${{ github.workspace }}\build\jpackage\PMPanel
        run: |
          & "${{ steps.inno.outputs.path }}" installer\pminesetup.iss
          if (-not (Test-Path "build\installer-out\PMPanel-Setup-$env:PMPANEL_VERSION-x64.exe")) { throw "installer missing" }

      - name: Build portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\jpackage\PMPanel -DestinationPath "build\installer-out\PMPanel-$env:PMPANEL_VERSION-portable-win64.zip"
          Get-ChildItem build\installer-out

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PMPanel-Windows-${{ env.PMPANEL_VERSION }}
          path: |
            build\installer-out\*.exe
            build\installer-out\*.zip
          retention-days: 30

      - name: Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build\installer-out\PMPanel-Setup-${{ env.PMPANEL_VERSION }}-x64.exe
            build\installer-out\PMPanel-${{ env.PMPANEL_VERSION }}-portable-win64.zip
          body: |
            PM Panel for Windows - run a Minecraft Bedrock server (PocketMine-MP) locally.

            ## Downloads
            - **PMPanel-Setup-${{ env.PMPANEL_VERSION }}-x64.exe** - recommended installer (per-user, no admin rights needed)
            - **PMPanel-${{ env.PMPANEL_VERSION }}-portable-win64.zip** - portable version, just unzip and run PMPanel.exe

            ## Requirements
            - Windows 10 / 11 (x64)
            - No installation dependencies - PHP runtime, PocketMine-MP and the fake-player engine are all bundled

            This is the Windows port of [Android-PacketMinePm-Panel](https://github.com/EXBYPIXEL/Android-PacketMinePm-Panel): same panel UI, same features - server console, multi-server profiles, file manager, plugin tools, plugin market, fake players, resource-pack fetcher, backups, RCON and connectivity tools.
          draft: false
          prerelease: false
